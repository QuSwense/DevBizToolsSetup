<!-- DataGrid HTML Templates -->
<!-- Loaded dynamically by datagrid.js via fetch() -->

<template data-template-id="dg-skeleton">
    <div class="page-head"
        style="display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap;">
        <div>
            <h1 style="font-size:20px; font-weight:600; margin:0;">{{title}}</h1>
            <p style="margin:4px 0 0; color:var(--dg-text-soft); font-size:13px;">{{description}}</p>
        </div>
        <div style="font-size:12px; color:var(--dg-text-soft);"><span id="{{id}}-themeLabel"
                data-tooltip="Current theme" data-tooltip-pos="left">Light mode</span></div>
    </div>
    <div class="datagrid-card" id="{{id}}-card">
        {{toolbar}}
        <div id="{{id}}-filtersBar" class="filters-bar">
            <div id="{{id}}-filterBadges" class="d-flex flex-wrap gap-1"></div><button
                class="btn btn-link p-0 ms-auto text-decoration-none" style="font-size:12.5px;"
                onclick="document.getElementById('{{id}}')._gridInstance.resetFilters()">Clear all</button>
        </div>
        <div class="table-wrap" id="{{id}}-tableWrap">
            <table class="datagrid" id="{{id}}-table" aria-label="{{title}}" aria-describedby="{{id}}-desc">
                <caption id="{{id}}-desc" class="visually-hidden">{{description}}</caption>
                <thead id="{{id}}-thead"></thead>
                <tbody id="{{id}}-tbody"></tbody>
            </table>
        </div>
        <div id="{{id}}-mobileCards" class="mobile-cards"></div>
        <div class="grid-footer">
            <div class="footer-left"><span>Showing <strong id="{{id}}-footerCount" aria-live="polite"
                        aria-atomic="true">0</strong></span><span
                    style="width:1px;height:14px;background:var(--dg-border);display:inline-block"></span>
                <label class="rows-select">Rows <select id="{{id}}-rowsPerPage"
                        aria-label="Rows per page">{{pageSizeOptions}}</select></label>
            </div>
            <nav aria-label="Pagination" class="d-flex align-items-center gap-2 flex-wrap" id="{{id}}-paginationWrap">
                <div class="pagination-modern" id="{{id}}-pagination" role="group" aria-label="Page navigation"></div>
            </nav>
        </div>
    </div>
    <div id="{{id}}-tooltip" role="tooltip"
        style="position:fixed; z-index:10000; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .14s ease, transform .14s ease; max-width:280px; background:var(--dg-primary); color:var(--dg-primary-text); border:1px solid var(--dg-primary); padding:6px 8px; font-size:11.5px; font-weight:500; line-height:1.4; box-shadow:var(--dg-shadow-md); white-space:nowrap;">
    </div>
    <div id="{{id}}-contextMenu" role="menu" aria-label="Row actions"
        style="position:fixed; min-width:220px; background:var(--dg-surface); border:1px solid var(--dg-border); box-shadow:var(--dg-shadow-md); z-index:9999; display:none; padding:4px;">
    </div>
</template>

<template data-template-id="dg-toolbar">
    <div class="grid-toolbar">
        <div class="toolbar-left">
            <div class="search-box" id="{{id}}-searchWrap"><i class="bi bi-search" aria-hidden="true"></i><input
                    type="text" id="{{id}}-search" placeholder="Search..." aria-label="Search"><button
                    class="search-clear" type="button" aria-label="Clear search"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="meta-group">
                <span class="meta-pill" data-tooltip="Total filtered"><span id="{{id}}-showingCount" aria-live="polite"
                        aria-atomic="true">0</span> records</span>
                <span class="meta-sep"></span>
                <span class="meta-pill selected" data-tooltip="Selected"><span id="{{id}}-selectedCount"
                        aria-live="polite" aria-atomic="true">0</span> selected</span>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="btn-dg btn-dg-icon" id="{{id}}-reloadBtn" type="button" aria-label="Reload data"
                data-tooltip="Reload from {{dataUrl}}"><i class="bi bi-cloud-download" aria-hidden="true"></i></button>
            <button class="btn-dg btn-dg-icon" id="{{id}}-stickyBtn" type="button"
                aria-label="Toggle sticky first column" aria-pressed="false" data-tooltip="Pin first column"><i
                    class="bi bi-pin-angle" id="{{id}}-stickyIcon" aria-hidden="true"></i></button>
            <button class="btn-dg btn-dg-icon" type="button" aria-label="Reset all"
                data-tooltip="Reset filters & sorting" id="{{id}}-resetBtn"><i class="bi bi-arrow-clockwise"
                    aria-hidden="true"></i></button>
            <button class="btn-dg btn-dg-icon" id="{{id}}-themeBtn" type="button" aria-label="Toggle theme"
                data-tooltip="Toggle theme"><i class="bi bi-moon-stars" id="{{id}}-themeIcon"
                    aria-hidden="true"></i></button>
            {{addButton}}
        </div>
    </div>
</template>

<template data-template-id="dg-context-menu">
    <div class="ctx-header" id="ctxHeader" role="presentation">Row actions</div>
    <div class="ctx-item" role="menuitem" tabindex="-1" data-action="copyId"><i class="bi bi-hash"
            aria-hidden="true"></i> Copy ID</div>
    <div class="ctx-item" role="menuitem" tabindex="-1" data-action="copyRow"><i class="bi bi-clipboard"
            aria-hidden="true"></i> Copy row as JSON</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" role="menuitem" tabindex="-1" data-action="toggle"><i class="bi bi-arrows-expand"
            aria-hidden="true"></i> Expand / Collapse</div>
    <div class="ctx-item" role="menuitem" tabindex="-1" data-action="edit"><i class="bi bi-pencil"
            aria-hidden="true"></i> Edit</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" role="menuitem" tabindex="-1" data-action="delete"><i class="bi bi-trash"
            aria-hidden="true"></i> Delete</div>
</template>
