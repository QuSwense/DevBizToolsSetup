<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0"><i class="fa-solid fa-heart-pulse text-primary me-2"></i>Health Checks</h4>
    <button class="btn btn-primary" onclick="window.HEALTH_MODULE.runSequential()"><i
            class="fa-solid fa-play me-1"></i>Run Sequential Checks</button>
</div>

<!-- Application Services -->
<div class="mb-3">
    <div class="health-category-header mb-2">
        <span class="health-category-icon"><i class="fa-solid fa-server"></i></span>
        <span>Application Services</span>
        <span class="badge bg-light text-dark border ms-auto" id="healthAppsCount">0 / 0</span>
    </div>
    <div class="row g-3" id="healthAppsCards">
        <!-- Populated by JS -->
    </div>
</div>

<!-- Database Connections -->
<div class="mb-3">
    <div class="health-category-header mb-2">
        <span class="health-category-icon"><i class="fa-solid fa-database"></i></span>
        <span>Database Connections</span>
        <span class="badge bg-light text-dark border ms-auto" id="healthDbCount">0 / 0</span>
    </div>
    <div class="row g-3" id="healthDbCards">
        <!-- Populated by JS -->
    </div>
</div>

<!-- Detail Modal is defined globally in index.html (id="healthDetailModal") -->
<!-- The module JS populates it via window.HEALTH_MODULE.showDetail() -->
</div>
</div>
</div>
</div>
