<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise App — Sidebar + DataGrid</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="./datagrid.css" rel="stylesheet">
<link href="./sidebar.css" rel="stylesheet">
<style>
  /* App specific tweaks - same flat philosophy */
  .breadcrumb-dg{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dg-text-soft); }
  .breadcrumb-dg a{ color:var(--dg-text-soft); text-decoration:none; }
  .breadcrumb-dg a:hover{ color:var(--dg-text); }
  .breadcrumb-dg .sep{ opacity:.4; }
  .content-placeholder{
    background:var(--dg-surface);
    border:1px solid var(--dg-border);
    padding:48px;
    text-align:center;
    color:var(--dg-text-soft);
  }
  .content-placeholder .ph-icon{
    width:48px; height:48px;
    border:1px solid var(--dg-border);
    background:var(--dg-surface-2);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar - Reusable Component -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>

  <!-- Main Content -->
  <div class="main-content">
    <header class="main-header">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="btn-dg btn-dg-icon" id="mobileMenuBtn" aria-label="Open menu" style="display:none;"><i class="bi bi-list" aria-hidden="true"></i></button>
        <div class="breadcrumb-dg" id="breadcrumb">
          <a href="#" data-tooltip="Home"><i class="bi bi-house" aria-hidden="true"></i></a>
          <span class="sep">/</span>
          <span>Team Directory</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="search-box" style="width:240px; display:none;" id="headerSearchWrap"><i class="bi bi-search" aria-hidden="true"></i><input type="text" placeholder="Search..." aria-label="Global search"></div>
        <button class="btn-dg btn-dg-icon" aria-label="Notifications" data-tooltip="Notifications" data-tooltip-pos="bottom"><i class="bi bi-bell" aria-hidden="true"></i></button>
        <button class="btn-dg btn-dg-icon" aria-label="Help" data-tooltip="Help" data-tooltip-pos="bottom"><i class="bi bi-question-circle" aria-hidden="true"></i></button>
        <div style="width:1px; height:20px; background:var(--dg-border);"></div>
        <button class="btn-dg" aria-label="Command palette" data-tooltip="⌘K"><i class="bi bi-command" aria-hidden="true"></i> <span style="font-size:12px;">⌘K</span></button>
      </div>
    </header>

    <div class="main-body" id="mainBody">
      <!-- Team Grid Container - Reusable DataGrid -->
      <div id="teamGrid"></div>

      <!-- Placeholder for other menu items -->
      <div id="placeholder" class="content-placeholder" style="display:none;">
        <div class="ph-icon"><i class="bi bi-inbox" aria-hidden="true"></i></div>
        <div style="font-weight:600; color:var(--dg-text); font-size:14px;" id="phTitle">Coming soon</div>
        <div style="font-size:13px; margin-top:6px; max-width:360px; margin-left:auto; margin-right:auto;" id="phDesc">This section is a demo of the sidebar navigation. The DataGrid library can be reused here with different data.</div>
        <div style="margin-top:16px;"><button class="btn-dg" onclick="showGrid()"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Team Directory</button></div>
      </div>
    </div>
  </div>
</div>

<!-- Modals for DataGrid -->
<div class="modal fade" id="addRecordModal" tabindex="-1" aria-labelledby="addModalTitle" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
    <div class="modal-header"><div class="modal-icon primary"><i class="bi bi-person-plus" aria-hidden="true"></i></div><div class="flex-grow-1"><h5 class="modal-title" id="addModalTitle">Add employee</h5></div><button type="button" class="btn-dg btn-dg-icon btn-dg-ghost" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
    <form id="addRecordForm"><div class="modal-body"><div class="row g-3">
      <div class="col-md-4"><label class="form-label">ID Code</label><input type="text" class="form-control" id="addRecordId" required></div>
      <div class="col-md-8"><label class="form-label">Full Name</label><input type="text" class="form-control" id="addRecordName" required></div>
      <div class="col-md-6"><label class="form-label">Role</label><input type="text" class="form-control" id="addRecordRole" required></div>
      <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="addRecordStatus" required><option value="Active" selected>Active</option><option value="On Leave">On Leave</option><option value="Inactive">Inactive</option></select></div>
      <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="addRecordEmail" required></div>
      <div class="col-md-6"><label class="form-label">Department</label><input type="text" class="form-control" id="addRecordDept"></div>
      <div class="col-md-6"><label class="form-label">Location</label><input type="text" class="form-control" id="addRecordLocation"></div>
      <div class="col-md-6"><label class="form-label">Projects (comma)</label><input type="text" class="form-control" id="addRecordProjects"></div>
    </div></div><div class="modal-footer"><button type="button" class="btn-dg" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-dg btn-dg-primary">Save</button></div></form>
  </div></div>
</div>

<div class="modal fade" id="editRecordModal" tabindex="-1" aria-labelledby="editModalTitle" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
    <div class="modal-header"><div class="modal-icon"><i class="bi bi-pencil" aria-hidden="true"></i></div><div class="flex-grow-1"><h5 class="modal-title" id="editModalTitle">Edit employee</h5></div><button type="button" class="btn-dg btn-dg-icon btn-dg-ghost" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
    <form id="editRecordForm"><div class="modal-body"><div class="row g-3">
      <div class="col-md-4"><label class="form-label">ID Code</label><input type="text" class="form-control" id="editRecordId" readonly></div>
      <div class="col-md-8"><label class="form-label">Full Name</label><input type="text" class="form-control" id="editRecordName" required></div>
      <div class="col-md-6"><label class="form-label">Role</label><input type="text" class="form-control" id="editRecordRole" required></div>
      <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="editRecordStatus" required><option value="Active">Active</option><option value="On Leave">On Leave</option><option value="Inactive">Inactive</option></select></div>
      <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="editRecordEmail" required></div>
      <div class="col-md-6"><label class="form-label">Department</label><input type="text" class="form-control" id="editRecordDept"></div>
      <div class="col-md-6"><label class="form-label">Location</label><input type="text" class="form-control" id="editRecordLocation"></div>
      <div class="col-md-6"><label class="form-label">Projects</label><input type="text" class="form-control" id="editRecordProjects"></div>
    </div></div><div class="modal-footer"><button type="button" class="btn-dg" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-dg btn-dg-primary">Save changes</button></div></form>
  </div></div>
</div>

<div class="modal fade" id="deleteRecordModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px;"><div class="modal-content"><div class="modal-body p-0">
    <div class="p-4 text-center"><div class="modal-icon danger mx-auto mb-3" style="width:42px;height:42px;"><i class="bi bi-trash3" aria-hidden="true"></i></div><h5 style="font-size:14.5px;" id="deleteModalTitle">Delete record?</h5><p class="mb-0" style="font-size:13px; color:var(--dg-text-soft);">Delete <strong id="deleteTargetName" style="color:var(--dg-text)"></strong>?</p></div>
    <div class="d-flex gap-2 p-3" style="background:var(--dg-surface-2); border-top:1px solid var(--dg-border);"><button type="button" class="btn-dg flex-grow-1 justify-content-center" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn-dg btn-dg-primary flex-grow-1 justify-content-center" style="background:#dc2626;border-color:#dc2626;color:#fff;" id="confirmDeleteBtn">Delete</button></div>
  </div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./datagrid.js"></script>
<script src="./datagrid-config.js"></script>
<script src="./sidebar.js"></script>
<script>
// Sidebar menu definition - 2 levels, data separated from logic
const appMenu = [
  { type: 'section', label: 'Main', items: [
    { id: 'dashboard', label: 'Dashboard', icon: 'bi-speedometer2' },
    { id: 'team', label: 'Team Directory', icon: 'bi-people', badge: 48 },
    { id: 'projects', label: 'Projects', icon: 'bi-kanban', children: [
      { id: 'projects-all', label: 'All Projects', icon: 'bi-folder', badge: 12 },
      { id: 'projects-mine', label: 'My Projects', icon: 'bi-person-workspace', badge: 3 },
      { id: 'projects-archived', label: 'Archived', icon: 'bi-archive', children: [
        { id: 'arch-2023', label: '2023 Archive', badge: '12' },
        { id: 'arch-2024', label: '2024 Archive', badge: '8' },
        { id: 'arch-templates', label: 'Templates' }
      ]}
    ]},
    { id: 'analytics', label: 'Analytics', icon: 'bi-bar-chart' },
    { id: 'reports', label: 'Reports', icon: 'bi-file-earmark-text', children: [
      { id: 'rep-monthly', label: 'Monthly', icon: 'bi-calendar-month' },
      { id: 'rep-quarterly', label: 'Quarterly', icon: 'bi-calendar-range' },
      { id: 'rep-custom', label: 'Custom Builder', icon: 'bi-sliders' }
    ]}
  ]},
  { type: 'section', label: 'Management', items: [
    { id: 'settings', label: 'Settings', icon: 'bi-gear', children: [
      { id: 'set-general', label: 'General', icon: 'bi-sliders' },
      { id: 'set-security', label: 'Security', icon: 'bi-shield-lock' },
      { id: 'set-billing', label: 'Billing', icon: 'bi-credit-card' },
      { id: 'set-team', label: 'Team', icon: 'bi-people-fill' }
    ]},
    { id: 'users', label: 'Users', icon: 'bi-person-badge', badge: 12 },
    { id: 'audit', label: 'Audit Log', icon: 'bi-clock-history' }
  ]},
  { type: 'section', label: 'Support', items: [
    { id: 'help', label: 'Help Center', icon: 'bi-question-circle' },
    { id: 'feedback', label: 'Feedback', icon: 'bi-chat-dots', badge: 'New' }
  ]}
];

function showGrid() {
  document.getElementById('teamGrid').style.display = 'block';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('breadcrumb').innerHTML = `<a href="#" data-tooltip="Home"><i class="bi bi-house" aria-hidden="true"></i></a><span class="sep">/</span><span>Team Directory</span>`;
}

function showPlaceholder(item) {
  document.getElementById('teamGrid').style.display = 'none';
  const ph = document.getElementById('placeholder');
  ph.style.display = 'block';
  document.getElementById('phTitle').textContent = item ? item.label : 'Coming soon';
  document.getElementById('phDesc').textContent = item ? `Demo view for ${item.label}. In a real app, this would load a different DataGrid with ${item.label} data.` : 'Placeholder';
  document.getElementById('breadcrumb').innerHTML = `<a href="#" onclick="showGrid(); return false;">Home</a><span class="sep">/</span><span>${item?item.label:'Section'}</span>`;
}

document.addEventListener('DOMContentLoaded', async ()=>{
  // Init Sidebar - reusable
  const sidebar = new Sidebar('#sidebar', {
    menu: appMenu,
    activeId: 'team',
    onSelect: (item)=>{
      if (!item) return;
      if (item.id === 'team' || item.id.startsWith('team')) {
        showGrid();
      } else if (item.children) {
        // parent with children - don't navigate, just toggle
        return;
      } else {
        showPlaceholder(item);
      }
    }
  });
  sidebar.init();
  window.appSidebar = sidebar;

  // Init DataGrid - reusable, data separated
  const teamGrid = new DataGrid('#teamGrid', teamDirectoryConfig);
  await teamGrid.init();
  document.getElementById('addRecordForm').addEventListener('submit', (e)=> handleAddSubmit(e, teamGrid));
  document.getElementById('editRecordForm').addEventListener('submit', (e)=> handleEditSubmit(e, teamGrid));
  document.getElementById('confirmDeleteBtn').addEventListener('click', ()=> handleDeleteConfirm(teamGrid));
  window.teamGrid = teamGrid;

  // Mobile menu button
  const mobileBtn = document.getElementById('mobileMenuBtn');
  const checkMobile = ()=>{
    if (window.innerWidth <= 768) {
      mobileBtn.style.display = 'inline-flex';
    } else {
      mobileBtn.style.display = 'none';
      document.querySelector('.sidebar').classList.remove('mobile-open');
      document.querySelector('.sidebar-overlay')?.classList.remove('show');
    }
  };
  checkMobile();
  window.addEventListener('resize', checkMobile);
  mobileBtn.addEventListener('click', ()=> sidebar.openMobile());

  // Listen to sidebar collapse to adjust layout if needed
  document.addEventListener('sidebar:toggle', (e)=>{
    // Could save state or adjust content
    console.log('Sidebar collapsed:', e.detail.collapsed);
  });
});
</script>
</body>
</html>
